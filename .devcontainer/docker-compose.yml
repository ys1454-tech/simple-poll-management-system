version: '3.8'

services:
  app:
    image: mcr.microsoft.com/devcontainers/python:3.13
    volumes:
      - ..:/workspaces/Simple-Poll-Management-System:cached
    command: sleep infinity
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=simple_poll_db
      - DB_USER=poll_user
      - DB_PASSWORD=poll_dev_password
      - DATABASE_URL=mysql+pymysql://poll_user:poll_dev_password@db:3306/simple_poll_db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - poll-network

  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: poll_dev_root_password
      MYSQL_DATABASE: simple_poll_db
      MYSQL_USER: poll_user
      MYSQL_PASSWORD: poll_dev_password
    volumes:
      - mysql-data:/var/lib/mysql
    # Port 3306 is not published to host for security and isolation.
    # It remains accessible internally to the app service via 'poll-network'.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ppoll_dev_root_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - poll-network

volumes:
  mysql-data:

networks:
  poll-network:
    driver: bridge
